<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>gridspan</title>
<style>body{font-family:system-ui,sans-serif;margin:24px;max-width:960px}
textarea{width:100%;height:150px;font-family:ui-monospace,monospace}
button{padding:6px 12px;margin:8px 8px 8px 0}pre{background:#f6f6f6;padding:10px;border-radius:6px;overflow:auto}
.ok{color:#0a7}.bad{color:#c00}</style>
</head>
<body>
<h1>gridspan 工作台</h1>
<p>改样例里的单元格跨度、编辑日志与重排行预算再点运行，结果给最终网格、冲突清单、陈旧行数与全量对照。</p>
<textarea id="input">{
  "bad_span_code": "E_BAD_SPAN",
  "budget": 1,
  "columns": 4,
  "applied": ["g1"],
  "cells": [
    {"id": "c1", "row": 0, "col": 0, "rowspan": 2, "colspan": 1, "text": "A"},
    {"id": "c2", "row": 0, "col": 1, "rowspan": 1, "colspan": 1, "text": "B"},
    {"id": "c3", "row": 0, "col": 2, "rowspan": 1, "colspan": 2, "text": "C"},
    {"id": "c4", "row": 2, "col": 2, "rowspan": 1, "colspan": 1, "text": "D"},
    {"id": "c5", "row": 2, "col": 3, "rowspan": 1, "colspan": 1, "text": "E"}
  ],
  "edits": [
    {"edit_id": "g1", "cell": "c5", "row": 2, "col": 3, "rowspan": 1, "colspan": 1, "text": "E"},
    {"edit_id": "g2", "cell": "c1", "row": 0, "col": 0, "rowspan": 3, "colspan": 2, "text": "A"},
    {"edit_id": "g3", "cell": "c6", "row": 3, "col": 0, "rowspan": 1, "colspan": 1, "text": "F"}
  ]
}</textarea>
<div><button id="run">运行</button><span id="status" class="ok">等待</span></div>
<pre id="out">还没跑</pre>
<script type="module">
import { render } from "./app.js";

document.getElementById("run").addEventListener("click", function () {
  const status = document.getElementById("status");
  try {
    const spec = JSON.parse(document.getElementById("input").value);
    const result = render(spec);
    status.className = "ok";
    status.textContent = "完成";
    document.getElementById("out").textContent = JSON.stringify(result, null, 1);
  } catch (error) {
    status.className = "bad";
    status.textContent = "出错 " + error.message;
    document.getElementById("out").textContent = String(error && error.stack ? error.stack : error);
  }
});
</script>
</body>
</html>
